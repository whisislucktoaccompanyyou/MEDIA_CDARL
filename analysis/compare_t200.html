<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全量 vs Q0 · t=200</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --grid: #e7e5e0;
    --series-all: #2a78d6;
    --series-q0: #eb6834;
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    margin: 0;
    padding: 28px 32px 40px;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; }
  p.note { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; max-width: 760px; }
  .legend { display: flex; gap: 18px; font-size: 13px; margin-bottom: 16px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
  h2 { font-size: 14px; font-weight: 650; margin: 0 0 2px; }
  .hint { color: var(--text-secondary); font-size: 12px; margin: 0 0 8px; }
  svg { display: block; overflow: visible; }
  .axis { fill: var(--text-secondary); font-size: 11px; }
  .val { fill: var(--text-primary); font-size: 11px; }
  table { border-collapse: collapse; margin-top: 28px; font-size: 13px; }
  th, td { text-align: right; padding: 6px 12px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child, th:last-child, td:last-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 550; }
  caption { text-align: left; font-weight: 650; margin-bottom: 8px; }
</style>
</head>
<body>
<main class="viz-root">
  <h1>全量 vs Q0，t=200，10 张图均值</h1>
  <p class="note">只比较模型自己的输出。每个指标单独一张图，单位不同，不能放在同一根轴上。原图圆盘圆形度是 0.606，因为视盘贴边，所以圆形度只做两边互比。</p>
  <div class="legend">
    <span><i class="swatch" style="background:#2a78d6"></i>全量</span>
    <span><i class="swatch" style="background:#eb6834"></i>Q0 优质图</span>
  </div>
  <div class="grid" id="charts"></div>
  <table>
    <caption>同一批数字</caption>
    <thead>
      <tr><th>指标</th><th>全量</th><th>Q0</th><th>谁更好</th></tr>
    </thead>
    <tbody>
      <tr><td>视盘内灰度差</td><td>60.06</td><td>26.57</td><td>Q0</td></tr>
      <tr><td>比原图暗多少</td><td>-58.65</td><td>-8.04</td><td>Q0</td></tr>
      <tr><td>与原图相关</td><td>0.657</td><td>0.706</td><td>Q0</td></tr>
      <tr><td>血管比背景暗</td><td>-5.01</td><td>-1.58</td><td>全量</td></tr>
      <tr><td>血管边缘锐度</td><td>2.13</td><td>1.78</td><td>全量</td></tr>
      <tr><td>圆盘圆形度</td><td>0.890</td><td>0.851</td><td>全量</td></tr>
      <tr><td>圆盘鼓包</td><td>0.0059</td><td>0.0104</td><td>全量</td></tr>
      <tr><td>mask 翻转响应</td><td>0.0257</td><td>0.0471</td><td>Q0</td></tr>
    </tbody>
  </table>
</main>
<script>
const charts = [
  ["视盘内灰度差", "越小越接近原图", [60.06, 26.57], false],
  ["比原图暗多少", "越接近 0 越好", [-58.65, -8.04], true],
  ["与原图相关", "越大越像", [0.657, 0.706], false],
  ["血管比背景暗", "越负越清楚", [-5.01, -1.58], true],
  ["血管边缘锐度", "越大越贴 mask", [2.13, 1.78], false],
  ["圆盘圆形度", "越大越圆", [0.890, 0.851], false],
  ["圆盘鼓包", "越小越好", [0.0059, 0.0104], false],
  ["mask 翻转响应", "越大越在用血管条件", [0.0257, 0.0471], false]
];
const host = document.getElementById("charts");
const colors = ["#2a78d6", "#eb6834"];
charts.forEach(([title, hint, values, diverging]) => {
  const card = document.createElement("section");
  card.innerHTML = "<h2>" + title + "</h2><p class='hint'>" + hint + "</p>";
  const w = 340, h = 92, labelW = 46, padR = 54;
  const plotW = w - labelW - padR;
  const max = Math.max(...values.map(Math.abs), 0.001);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("width", "100%");
  const baseline = diverging ? labelW + plotW / 2 : labelW;
  const scale = diverging ? (plotW / 2) / max : plotW / max;
  const names = ["全量", "Q0"];
  values.forEach((value, i) => {
    const y = 8 + i * 36;
    const width = Math.abs(value) * scale;
    const x = diverging ? (value < 0 ? baseline - width : baseline) : labelW;
    const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bar.setAttribute("x", x);
    bar.setAttribute("y", y);
    bar.setAttribute("width", Math.max(width, 1));
    bar.setAttribute("height", 18);
    bar.setAttribute("rx", value >= 0 || !diverging ? 4 : 0);
    bar.setAttribute("fill", colors[i]);
    svg.appendChild(bar);
    const name = document.createElementNS("http://www.w3.org/2000/svg", "text");
    name.setAttribute("x", 0);
    name.setAttribute("y", y + 13);
    name.setAttribute("class", "axis");
    name.textContent = names[i];
    svg.appendChild(name);
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    const lx = diverging ? (value < 0 ? x - 6 : x + width + 6) : labelW + width + 6;
    label.setAttribute("x", lx);
    label.setAttribute("y", y + 13);
    label.setAttribute("class", "val");
    label.setAttribute("text-anchor", diverging && value < 0 ? "end" : "start");
    label.textContent = value.toFixed(value >= 10 || value <= -10 ? 1 : 3);
    svg.appendChild(label);
  });
  if (diverging) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", baseline);
    line.setAttribute("x2", baseline);
    line.setAttribute("y1", 4);
    line.setAttribute("y2", 78);
    line.setAttribute("stroke", "#e7e5e0");
    svg.insertBefore(line, svg.firstChild);
  }
  card.appendChild(svg);
  host.appendChild(card);
});
</script>
</body>
</html>
